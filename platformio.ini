[env:weact_h723vg]
platform = ststm32@19.2.0
platform_packages = toolchain-gccarmnoneeabi@1.120301.0
board = weact_h723vg
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
board_build.ldscript = STM32H723VGTx_FLASH.ld
build_flags =
    -D HSE_VALUE=25000000U
    -D USE_PWR_LDO_SUPPLY
    -D HAVE_CONFIG_H
    -D WEACT_H723
    -I include/engine

